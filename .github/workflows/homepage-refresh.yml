name: one-time homepage refresh

on:
  push:
    paths:
      - .github/workflows/homepage-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update homepage content
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def must_replace(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"missing expected text: {label}")
              return text.replace(old, new)

          # ---------- index.html ----------
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          text = must_replace(
              text,
              'content="Mars Guo\'s work portfolio: research tools, local AI, operations research, and City2049."',
              'content="Mars Guo\'s work portfolio: research tools, local AI, autonomous systems, operations research, and City2049."',
              'static meta description',
          )
          text = must_replace(
              text,
              '<title>Mars Guo · Research Tools, Local AI &amp; City2049</title>',
              '<title>Mars Guo · Research Tools, Local AI, Autonomous Systems &amp; City2049</title>',
              'static title',
          )

          # Local AI hero: concise, current positioning.
          text = must_replace(
              text,
              'data-en="Local models · Reproducible creative workflows" data-zh="本地模型 · 可复现的创作工作流">Local models · Reproducible creative workflows',
              'data-en="Local models · Reusable AI workflows" data-zh="本地模型 · 可复用 AI 工作流">Local models · Reusable AI workflows',
              'local ai badge',
          )
          text = must_replace(
              text,
              'data-en="A practical topic around local LLM deployment and ComfyUI: documenting setup, decisions and repeatable workflows for private translation, text-to-image, text-to-video, image-to-video and digital-human applications." data-zh="围绕本地大模型部署与 ComfyUI 的实践主题：记录环境搭建、关键选择和可复现工作流，覆盖私有翻译、文生图、文生视频、图生视频与数字人应用。">A practical topic around local LLM deployment and ComfyUI: documenting setup, decisions and repeatable workflows for private translation, text-to-image, text-to-video, image-to-video and digital-human applications.',
              'data-en="Explore local models, build reusable AI workflows, and study how model and workflow choices can be optimized." data-zh="探索本地模型，构建可复用的 AI 工作流，并进一步研究如何优化模型与工作流选择。">Explore local models, build reusable AI workflows, and study how model and workflow choices can be optimized.',
              'local ai lead',
          )

          # Replace the three Local AI window items with real repositories.
          start = text.index('                <div class="window-body local-list">')
          end = text.index('\n              </section>', start)
          local_window = '''                <div class="window-body local-list">
                  <a href="https://github.com/marsguo2049/my-llm" target="_blank" rel="noreferrer"><div class="local-icon">LLM</div><div><h2>My LLM</h2><p data-i18n data-en="Local-model deployment, experiments and practical notes." data-zh="记录本地大模型部署、实验与实际使用。">Local-model deployment, experiments and practical notes.</p></div><small class="status development" data-i18n data-en="In development" data-zh="开发中">In development</small></a>
                  <a href="https://github.com/marsguo2049/comfyui-py-workflow" target="_blank" rel="noreferrer"><div class="local-icon">UI</div><div><h2>ComfyUI Py Workflow</h2><p data-i18n data-en="Run and chain local ComfyUI image/video workflows from Python." data-zh="用 Python 调用并串联本地 ComfyUI 图像与视频工作流。">Run and chain local ComfyUI image/video workflows from Python.</p></div><small class="status development" data-i18n data-en="Prototype · demo" data-zh="原型 · 演示">Prototype · demo</small></a>
                  <a href="https://github.com/marsguo2049/multi-model-workflow-optimization" target="_blank" rel="noreferrer"><div class="local-icon">OR</div><div><h2>Multi-Model Workflow Optimization</h2><p data-i18n data-en="Optimize model, configuration and workflow choices across quality, cost and resources." data-zh="在质量、成本和资源之间优化模型、参数与工作流选择。">Optimize model, configuration and workflow choices across quality, cost and resources.</p></div><small class="status development" data-i18n data-en="Public research" data-zh="公开研究">Public research</small></a>
                </div>'''
          text = text[:start] + local_window + text[end:]

          # Replace Local AI catalogue group with the same three real projects.
          marker = '            <section class="catalog-group">\n              <h3><span>02</span><b data-i18n data-en="Local AI Lab"'
          cstart = text.index(marker)
          cend = text.index('\n            </section>', cstart) + len('\n            </section>')
          local_catalog = '''            <section class="catalog-group">
              <h3><b data-i18n data-en="Local AI Lab" data-zh="本地 AI 实验室">Local AI Lab</b></h3>
              <div class="catalog-grid three">
                <a class="catalog-card" href="https://github.com/marsguo2049/my-llm" target="_blank" rel="noreferrer"><div><h4>My LLM</h4><p data-i18n data-en="Local-model deployment, experiments and practical notes." data-zh="记录本地大模型部署、实验与实际使用。">Local-model deployment, experiments and practical notes.</p></div><small class="status development" data-i18n data-en="In development" data-zh="开发中">In development</small></a>
                <a class="catalog-card" href="https://github.com/marsguo2049/comfyui-py-workflow" target="_blank" rel="noreferrer"><div><h4>ComfyUI Py Workflow</h4><p data-i18n data-en="Python execution layer for reusable local ComfyUI image and video workflows." data-zh="用 Python 运行并复用本地 ComfyUI 图像与视频工作流。">Python execution layer for reusable local ComfyUI image and video workflows.</p></div><small class="status development" data-i18n data-en="Prototype · demo" data-zh="原型 · 演示">Prototype · demo</small></a>
                <a class="catalog-card" href="https://github.com/marsguo2049/multi-model-workflow-optimization" target="_blank" rel="noreferrer"><div><h4>Multi-Model Workflow Optimization</h4><p data-i18n data-en="Optimize model, configuration and workflow choices across quality, cost and resources." data-zh="在质量、成本和资源之间优化模型、参数与工作流选择。">Optimize model, configuration and workflow choices across quality, cost and resources.</p></div><small class="status development" data-i18n data-en="Public research" data-zh="公开研究">Public research</small></a>
              </div>
            </section>'''
          text = text[:cstart] + local_catalog + text[cend:]

          # Remove theme numbering from kickers, window bars, switcher and catalogue headings.
          replacements = {
              'data-en="01 / RESEARCH TOOLS" data-zh="01 / 科研工具">01 / RESEARCH TOOLS': 'data-en="RESEARCH TOOLS" data-zh="科研工具">RESEARCH TOOLS',
              'data-en="02 / LOCAL AI LAB" data-zh="02 / 本地 AI 实验室">02 / LOCAL AI LAB': 'data-en="LOCAL AI LAB" data-zh="本地 AI 实验室">LOCAL AI LAB',
              'data-en="03 / CITY2049" data-zh="03 / CITY2049">03 / CITY2049': 'data-en="CITY2049" data-zh="CITY2049">CITY2049',
              '<span>research-workflow / pipeline</span><b>01</b>': '<span>research-workflow / pipeline</span>',
              '<span>local-ai / workspace</span><b>02</b>': '<span>local-ai / workspace</span>',
              '<span>city2049 / system-context</span><b>03</b>': '<span>city2049 / system-context</span>',
              '<button class="is-active" type="button" data-scene-target="0"><span>01</span><b': '<button class="is-active" type="button" data-scene-target="0"><b',
              '<button type="button" data-scene-target="1"><span>02</span><b': '<button type="button" data-scene-target="1"><b',
              '<button type="button" data-scene-target="2"><span>03</span><b>City2049': '<button type="button" data-scene-target="2"><b>City2049',
              '<h3><span>01</span><b data-i18n data-en="Research workflow"': '<h3><b data-i18n data-en="Research workflow"',
              '<h3><span>03</span><b data-i18n data-en="City2049 &amp; OR Systems"': '<h3><b data-i18n data-en="City2049 &amp; OR Systems"',
              '<h3><span>04</span><b data-i18n data-en="Research directions"': '<h3><b data-i18n data-en="Research directions"',
          }
          for old, new in replacements.items():
              text = must_replace(text, old, new, old[:50])
          path.write_text(text, encoding='utf-8')

          # ---------- script.js ----------
          path = Path('script.js')
          text = path.read_text(encoding='utf-8')
          script_replacements = {
              'data-en="04 / AUTONOMOUS SYSTEMS LAB" data-zh="04 / 无人实验室">04 / AUTONOMOUS SYSTEMS LAB': 'data-en="AUTONOMOUS SYSTEMS LAB" data-zh="无人实验室">AUTONOMOUS SYSTEMS LAB',
              '<span>autonomous-lab / simple-map</span><b>04</b>': '<span>autonomous-lab / simple-map</span>',
              '<button type="button" data-scene-target="3"><span>04</span><b data-i18n': '<button type="button" data-scene-target="3"><b data-i18n',
              '<h3><span>04</span><b data-i18n data-en="Autonomous Systems Lab"': '<h3><b data-i18n data-en="Autonomous Systems Lab"',
          }
          for old, new in script_replacements.items():
              text = must_replace(text, old, new, old[:50])
          # MMWO now lives directly in index.html; remove the dynamic append patch.
          tail_marker = '\nconst localAiGroup = '
          if tail_marker not in text:
              raise SystemExit('missing dynamic Local AI append block')
          text = text.split(tail_marker, 1)[0].rstrip() + '\n'
          path.write_text(text, encoding='utf-8')

          # ---------- style.css ----------
          path = Path('style.css')
          text = path.read_text(encoding='utf-8')
          text = must_replace(text, 'grid-template-columns:70px 1fr 30px;', 'grid-template-columns:70px 1fr;', 'window bar columns')
          text = must_replace(
              text,
              '.local-list { display:grid; gap:8px; }.local-list article { display:grid; grid-template-columns:42px 1fr auto; gap:12px; align-items:center; min-height:92px; padding:14px; border:1px solid rgba(255,255,255,.09); border-radius:14px; background:rgba(255,255,255,.045); }',
              '.local-list { display:grid; gap:8px; }.local-list article,.local-list>a { display:grid; grid-template-columns:42px 1fr auto; gap:12px; align-items:center; min-height:92px; padding:14px; border:1px solid rgba(255,255,255,.09); border-radius:14px; background:rgba(255,255,255,.045); text-decoration:none; transition:background .2s ease,transform .2s ease; }.local-list>a:hover { background:rgba(255,255,255,.10); transform:translateX(3px); }',
              'local links desktop',
          )
          text = must_replace(text, '.local-list article { min-height:64px;', '.local-list article,.local-list>a { min-height:64px;', 'local links mobile')
          path.write_text(text, encoding='utf-8')

          # ---------- README.md ----------
          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          text = must_replace(text, '# Mars Guo — Research Tools, Local AI & City2049', '# Mars Guo — Research Tools, Local AI, Autonomous Systems & City2049', 'README title')
          theme_start = text.index('## 三个主题 / Three themes')
          theme_end = text.index('\n`Projects` 和 `Ideas`', theme_start)
          themes = '''## 主题 / Themes

- **Research Tools / 科研工具** — 围绕真实科研流程构建工具。
- **Local AI Lab / 本地 AI 实验室** — 从本地模型，到可复用工作流，再到多模型工作流优化。
- **City2049** — 为独立运筹优化实验提供共享的未来语境。
- **Autonomous Systems Lab / 无人实验室** — 从单体自主能力走向多智能体、异构协同与系统级 OR。
'''
          text = text[:theme_start] + themes + text[theme_end:]
          local_start = text.index('## Local AI Lab / 本地 AI 实验室')
          local_end = text.index('\n## Language and interaction', local_start)
          local_readme = '''## Local AI Lab / 本地 AI 实验室

- **[My LLM](https://github.com/marsguo2049/my-llm)** — 本地大模型部署、实验与实际使用记录。
- **[ComfyUI Py Workflow](https://github.com/marsguo2049/comfyui-py-workflow)** — 用 Python 调用并串联本地 ComfyUI 图像与视频工作流。
- **[Multi-Model Workflow Optimization](https://github.com/marsguo2049/multi-model-workflow-optimization)** — 研究质量、成本与资源权衡下的模型、参数与工作流选择。
'''
          text = text[:local_start] + local_readme + text[local_end:]
          text = must_replace(text, 'Keyboard arrows or numbers `1`–`3`', 'Keyboard arrows or numbers `1`–`4`', 'README keyboard range')
          path.write_text(text, encoding='utf-8')
          PY

          # Remove this one-time workflow from the resulting commit.
          rm .github/workflows/homepage-refresh.yml

          node --check script.js
          grep -q 'github.com/marsguo2049/my-llm' index.html
          grep -q 'github.com/marsguo2049/comfyui-py-workflow' index.html
          grep -q 'github.com/marsguo2049/multi-model-workflow-optimization' index.html
          ! grep -q 'ComfyUI Workflow Guides' index.html
          ! grep -q 'Private Translation Workflow' index.html
          ! grep -q '<span>01</span><b data-i18n data-en="Research Tools"' index.html
          ! grep -q 'const localAiGroup' script.js

      - name: Commit refreshed homepage
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html script.js style.css README.md .github/workflows/homepage-refresh.yml
          git commit -m "Refresh Local AI project map and simplify navigation"
          git push origin HEAD:main
