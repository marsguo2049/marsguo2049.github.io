name: one-time homepage refresh

on:
  push:
    paths:
      - .github/workflows/homepage-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply homepage patch
        run: python .github/homepage_patch.py
      - name: Validate
        shell: bash
        run: |
          node --check script.js
          grep -q 'github.com/marsguo2049/my-llm' index.html
          grep -q 'github.com/marsguo2049/comfyui-py-workflow' index.html
          grep -q 'github.com/marsguo2049/multi-model-workflow-optimization' index.html
          if grep -q 'ComfyUI Workflow Guides' index.html; then exit 1; fi
          if grep -q 'Private Translation Workflow' index.html; then exit 1; fi
          if grep -q 'const localAiGroup' script.js; then exit 1; fi
      - name: Commit refreshed homepage
        shell: bash
        run: |
          rm .github/homepage_patch.py .github/workflows/homepage-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html script.js style.css README.md .github/homepage_patch.py .github/workflows/homepage-refresh.yml
          git commit -m "Refresh Local AI project map and simplify navigation"
          git push origin HEAD:main
